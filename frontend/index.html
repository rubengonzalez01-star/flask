<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="app.js"></script>
    <title>Ejercicios propuestos</title>
</head>
<body>
    <div class="container my-5 text-center">
        <fieldset>
            <legend>Seleccione una opción:</legend>
            <input type="radio" id="opcion1" name="opcion" value="1" checked onclick="opcion1()" />
            <label for="opcion1">Ecuación</label>
            <input type="radio" id="opcion2" name="opcion" value="2" onclick="opcion2()" />
            <label for="opcion2">Tabla</label>
            <input type="radio" id="opcion3" name="opcion" value="3" onclick="opcion3()" />
            <label for="opcion3">Círculo</label>
            <input type="radio" id="opcion4" name="opcion" value="4" onclick="opcion4()" />
            <label for="opcion4">Cuadrado</label>
            <input type="radio" id="opcion5" name="opcion" value="5" onclick="opcion5()" />
            <label for="opcion5">Triángulo</label>
        </fieldset>
        <div class="mt-3">
            <input type="number" step="any" id="t1" name="t1" placeholder="X" />
            <input type="number" step="any" id="t2" name="t2" placeholder="Z" />
        </div>
        <div class="container my-5 text-center">
            <button class="btn btn-success w-25" onclick="enviar()">Enviar</button>
            <div class="mt-5" id="contenido"></div>
        </div>
    </div>
</body>
</html>
